<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBERNOVA - Account Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body {
      background: #07090e; color: #fff; height: 100vh; display: flex;
      align-items: center; justify-content: center; overflow: hidden;
    }
    .auth-card {
      background: #121621; border: 2px solid #ffcc00; border-radius: 16px;
      width: 90%; max-width: 420px; padding: 30px; text-align: center;
      box-shadow: 0 0 30px rgba(255, 204, 0, 0.2);
    }
    .auth-title { font-size: 24px; font-weight: 900; color: #ffcc00; margin-bottom: 6px; letter-spacing: 1px; }
    .auth-sub { font-size: 12px; color: #8a99ad; margin-bottom: 24px; }
    
    .input-group { margin-bottom: 16px; text-align: left; }
    .input-label { font-size: 11px; font-weight: 700; color: #bdc3c7; margin-bottom: 6px; display: block; text-transform: uppercase; }
    .input-field {
      width: 100%; background: #1a202c; border: 1px solid #2d3748; color: #fff;
      padding: 12px; border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s;
    }
    .input-field:focus { border-color: #ffcc00; box-shadow: 0 0 10px rgba(255,204,0,0.3); }

    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 800;
      font-size: 13px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px;
      transition: 0.2s; margin-bottom: 12px;
    }
    .btn-gold { background: linear-gradient(180deg, #f39c12, #d35400); color: #fff; box-shadow: 0 4px 12px rgba(243,156,18,0.4); }
    .btn-gold:hover { transform: translateY(-1px); filter: brightness(1.1); }
    .btn-guest { background: #2c3e50; color: #ecf0f1; border: 1px solid #4a6572; }
    .btn-guest:hover { background: #34495e; }

    .divider { margin: 16px 0; color: #4a5568; font-size: 12px; font-weight: 700; position: relative; }
    .divider::before, .divider::after {
      content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: #2d3748;
    }
    .divider::before { left: 0; } .divider::after { right: 0; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-title">CYBER NOVA</div>
    <div class="auth-sub">Tiến Lên Miền Nam Casino Pro</div>

    <form onsubmit="handleRegister(event)">
      <div class="input-group">
        <label class="input-label">Username / Display Name</label>
        <input type="text" id="username-input" class="input-field" placeholder="Enter name..." required maxlength="15">
      </div>
      <button type="submit" class="btn btn-gold">START PLAYING (CLAIM $50 BONUS)</button>
    </form>

    <div class="divider">OR</div>

    <button class="btn btn-guest" onclick="handleGuestPlay()">PLAY AS GUEST (START WITH $20)</button>
  </div>

  <script>
    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('username-input').value.trim();
      if (!name) return;

      localStorage.setItem('cybernova_user_name', name);
      localStorage.setItem('cybernova_user_chips', '50.00');
      localStorage.setItem('cybernova_account_type', 'registered');
      window.location.href = './index.html';
    }

    function handleGuestPlay() {
      const randomId = Math.floor(1000 + Math.random() * 9000);
      localStorage.setItem('cybernova_user_name', `Guest_${randomId}`);
      localStorage.setItem('cybernova_user_chips', '20.00');
      localStorage.setItem('cybernova_account_type', 'guest');
      window.location.href = './index.html';
    }
  </script>

</body>
</html>
